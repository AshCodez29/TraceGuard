spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/traceguard_scratch?createDatabaseIfNotExist=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${TG_DB_USER}
    password: ${TG_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
traceguard:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 480
  datasource-encryption-key: ${DATASOURCE_ENCRYPTION_KEY}
  admin-initial-username: ${ADMIN_INITIAL_USERNAME:}
  admin-initial-email: ${ADMIN_INITIAL_EMAIL:}
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
  organization-name: ${TRACEGUARD_ORGANIZATION:Northwind Labs}
  llm:
    api-key: ${LLM_API_KEY}
  cors-origins: http://localhost:5173
  allowed-target-hosts: localhost,127.0.0.1,mysql
